name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # This repo commits a pnpm lockfile. If you fork and switch to npm or
      # yarn, change these two steps and the ones in commitlint.yml to match.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next build` type-checks the whole project, which is what makes a bad
      # quest.config.ts a failed build rather than a broken deploy.
      - run: pnpm build

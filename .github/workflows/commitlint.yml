name: commitlint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: commits and pr title
    runs-on: ubuntu-latest

    # Dependabot writes conventional titles already (see dependabot.yml), but a
    # long package name can push the header past 72 chars, and hand-editing
    # every bump isn't worth it. The condition sits on the lint steps rather
    # than the job so the job still reports success — a required status check
    # that reports "skipped" can leave a PR unmergeable.
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the full range between base and head.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint commits in this pr
        if: github.actor != 'dependabot[bot]'
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: lint pr title
        if: github.actor != 'dependabot[bot]'
        # Squash-merging uses the PR title as the commit subject, so it has to
        # pass the same rules. Passed through the environment, never
        # interpolated into the script — a PR title is untrusted input.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose
